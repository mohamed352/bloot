name: firebase_app_distribution_ios
description: A no-op Dart implementation of firebase_app_distribution_ios to avoid CocoaPods conflicts.
version: 1.3.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  firebase_app_distribution_platform_interface: ^1.3.0
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        dartPluginClass: FirebaseAppDistributionIOS
        fileName: firebase_app_distribution_ios.dart
