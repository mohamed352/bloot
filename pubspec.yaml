name: bloot
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1

  # Immutability & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.5.0
  uuid: ^4.5.1

  # Navigation
  go_router: ^17.0.1

  # Localization
  easy_localization: ^3.0.8

  # UI
  google_fonts: ^8.0.0
  cached_network_image: ^3.4.1
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.8

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Utilities
  logger: ^2.6.2
  connectivity_plus: ^6.1.5
  image_picker: ^1.2.1
  intl: ^0.20.2
  package_info_plus: ^8.3.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  cloud_functions: ^6.2.0
  firebase_messaging: ^16.2.0
  firebase_app_check: ^0.4.0
  firebase_crashlytics: ^5.0.0
  firebase_performance: ^0.11.0
  firebase_remote_config: ^6.0.0

  # Voice/Video
  agora_rtc_engine: ^6.5.4

  # Share
  share_plus: ^10.0.0

  # Deep Links / URLs
  app_links: ^6.4.0
  url_launcher: ^6.0.0

  # Audio
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  freezed: ^3.2.3
  json_serializable: ^6.9.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  test: ^1.29.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/sounds/
