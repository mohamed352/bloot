<body class="bg-surface text-on-surface antialiased h-screen w-full flex items-center justify-center overflow-hidden">
<!-- Background element to simulate the app beneath the overlay -->
<div class="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1598555239967-dfb164106ec1?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover bg-center opacity-30" data-alt="A sophisticated, low-lit environment resembling a premium dark social card room. The scene is dominated by deep blacks and rich purple ambient glows, creating a luxurious and immersive atmosphere. Subtle hints of a card table and soft lighting suggest an exclusive gaming space."></div>
<!-- The Loading Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-surface/80 backdrop-blur-md">
<!-- Loading Container -->
<div class="bg-surface-elevated border border-border shadow-[0_8px_24px_rgba(0,0,0,0.3)] rounded-xl p-xl flex flex-col items-center justify-center space-y-lg w-[80%] max-w-[320px] relative overflow-hidden shadow-[0_0_40px_rgba(139,92,246,0.15)]">
<!-- Spinner -->
<div class="relative flex items-center justify-center w-16 h-16">
<!-- Outer glow ring -->
<div class="absolute inset-0 rounded-full border-4 border-transparent border-t-primary-light border-r-primary-light opacity-50 animate-[spin_1.5s_linear_infinite]"></div>
<!-- Inner solid ring -->
<div class="absolute inset-1 rounded-full border-4 border-surface-hover border-t-primary animate-[spin_1s_ease-in-out_infinite]"></div>
<!-- Center icon (optional game theme touch) -->
<span class="material-symbols-outlined text-primary-light text-2xl z-10" style="font-variation-settings: 'FILL' 1;">
                    playing_cards
                </span>
</div>
<!-- Loading Text -->
<div class="text-center space-y-sm">
<h2 class="font-headline text-headline text-on-surface">جاري التحميل...</h2>
<p class="font-body text-body text-on-surface-muted">يتم تجهيز طاولة اللعب</p>
</div>
