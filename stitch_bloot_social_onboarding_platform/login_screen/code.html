<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col items-center justify-center p-xl">
<!-- RTL Note: For RTL support, add dir="rtl" to the html tag and ensure flexbox directions and margins/paddings are correctly flipped (e.g., ms/me instead of ml/mr if using logical properties, though standard tailwind here is ltr by default unless explicitly adjusted). -->
<main class="w-full max-w-[448px] mx-auto flex flex-col gap-xxl">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-md">
<h1 class="text-display font-display text-primary tracking-wider mb-sm">Bloot</h1>
<h2 class="text-headline font-headline text-on-surface">Welcome Back</h2>
<p class="text-body font-body text-on-surface-variant">Sign in to continue playing</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-xl">
<!-- Phone Input -->
<div class="flex flex-col gap-sm">
<label class="text-label font-label text-on-surface-variant" for="phone">Phone Number</label>
<div class="flex bg-surface-muted border border-border-light rounded-xl overflow-hidden focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all duration-200 shadow-md shadow-primary-dark/5">
<button class="flex items-center gap-xs px-md py-md bg-surface-elevated text-on-surface border-r border-border-light hover:bg-surface-hover transition-colors" type="button">
<span class="text-body font-body">+966</span>
<span class="material-symbols-outlined text-[20px]" data-icon="expand_more">expand_more</span>
</button>
<input class="flex-1 bg-transparent border-none text-on-surface text-body font-body px-md py-md focus:ring-0 placeholder:text-on-surface-muted" id="phone" placeholder="5X XXX XXXX" type="tel"/>
</div>
</div>
<!-- Primary Button -->
<button class="w-full h-[52px] rounded-full bg-gradient-to-r from-primary-dark to-primary-light text-on-primary-fixed flex items-center justify-center shadow-[0_0_24px_rgba(139,92,246,0.25)] hover:shadow-[0_0_32px_rgba(139,92,246,0.4)] active:scale-95 transition-all duration-200" type="button">
<span class="text-title font-title">Send Code</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md w-full">
<div class="flex-1 h-px bg-border-light"></div>
<span class="text-caption font-caption text-on-surface-variant uppercase tracking-wider">or continue with</span>
<div class="flex-1 h-px bg-border-light"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-md">
<!-- Apple Login (Dark Style) -->
<button class="w-full h-[52px] rounded-full bg-surface-container-high border border-border text-on-surface flex items-center justify-center gap-sm hover:bg-surface-hover transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="apple" data-weight="fill" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="text-title font-title">Continue with Apple</span>
</button>
<!-- Google Login (Outlined Style) -->
<button class="w-full h-[52px] rounded-full bg-transparent border border-outline text-on-surface flex items-center justify-center gap-sm hover:bg-surface-hover transition-colors" type="button">
<span class="material-symbols-outlined text-[#EA4335]" data-icon="account_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">account_circle</span>
<span class="text-title font-title">Continue with Google</span>
</button>
</div>
<!-- Footer Link -->
<div class="text-center mt-sm">
<p class="text-body font-body text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary hover:text-primary-light font-bold transition-colors" href="#">Sign Up</a>
</p>
</div>
</main>
</body></html>
