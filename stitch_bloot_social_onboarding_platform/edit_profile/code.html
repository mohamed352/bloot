<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface-container-lowest border-b border-border-light shadow-sm z-50">
<div class="flex justify-between items-center px-lg h-16 w-full max-w-[448px] mx-auto z-50">
<button class="text-on-surface hover:bg-surface-hover transition-all active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-headline text-on-surface">Edit Profile</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 px-xl max-w-[448px] mx-auto flex flex-col gap-xl pb-xxl">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center gap-md mt-lg">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full overflow-hidden border-2 border-primary border-opacity-50 relative bg-surface-muted shadow-[0_0_20px_rgba(139,92,246,0.15)]">
<img alt="Ahmed Profile Picture" class="w-full h-full object-cover" data-alt="A high-quality portrait of a Middle Eastern man in modern casual attire, serving as a profile avatar. The background is slightly blurred, emphasizing the subject. The lighting is soft and flattering, suitable for a premium social gaming app environment. The overall tone is approachable yet sophisticated, fitting within a dark social UI aesthetic with deep blacks and subtle purple ambient light influences." src="https://lh3.googleusercontent.com/aida-public/AB6AXuANt1nr0aigce_SCBQ-g0o2tcpuBnT-EUkP-SfPTBX2bk6Cv0U3WLS4RS4erRI3aDlZe2u1ASymUhz3CvzupOq-VEpmZW7wddt0wbsLoCytwB72f_LOrlZ619XMh43aqgba5H9-kNeiyZ5TrKFYdH_dGDUoT_ybXg_EUXsFfwD__O7lfgOt6prw2OkyhBiqkzc8NusRNvNNybl6SIt_RMJsmWUudn0P_EvEFdw8j6WditH0qBxa_5OC9Tm7nWzQArHs1BqeexOGNMgf"/>
<!-- Camera Overlay -->
<div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white" data-icon="photo_camera">photo_camera</span>
</div>
</div>
<div class="absolute -bottom-2 -right-2 bg-surface-elevated border border-border p-1.5 rounded-full shadow-md">
<span class="material-symbols-outlined text-primary text-sm" data-icon="edit">edit</span>
</div>
</div>
<button class="font-label text-label text-primary-light hover:text-primary transition-colors">Change Photo</button>
</section>
<!-- Edit Form -->
<form class="flex flex-col gap-lg">
<!-- Display Name -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant ml-1" for="display_name">Display Name</label>
<input class="bg-surface-muted border border-border-light rounded-lg px-md py-3 font-body text-body text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-on-surface-secondary" id="display_name" type="text" value="Ahmed"/>
</div>
<!-- Username -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant ml-1" for="username">Username</label>
<div class="relative flex items-center">
<span class="absolute left-md text-on-surface-secondary font-body text-body">@</span>
<input class="bg-surface-muted border border-border-light rounded-lg pl-8 pr-md py-3 w-full font-body text-body text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-on-surface-secondary" id="username" type="text" value="ahmed_pro"/>
</div>
</div>
<!-- Bio -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant ml-1" for="bio">Bio</label>
<textarea class="bg-surface-muted border border-border-light rounded-lg px-md py-3 font-body text-body text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all resize-none placeholder:text-on-surface-secondary" id="bio" rows="3">Baloot lover since 2015. Always ready for a challenging match. Let's play!</textarea>
</div>
<!-- Region (Dropdown) -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant ml-1" for="region">Region</label>
<div class="relative">
<select class="appearance-none bg-surface-muted border border-border-light rounded-lg px-md py-3 w-full font-body text-body text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all cursor-pointer" id="region">
<option selected="" value="sa">Saudi Arabia</option>
<option value="ae">United Arab Emirates</option>
<option value="kw">Kuwait</option>
<option value="qa">Qatar</option>
<option value="bh">Bahrain</option>
<option value="om">Oman</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-secondary pointer-events-none" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
<!-- Favorite Mode -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant ml-1">Favorite Mode</label>
<div class="grid grid-cols-2 gap-md">
<label class="flex items-center justify-center p-3 rounded-lg border-2 border-primary bg-primary/10 cursor-pointer transition-all">
<input checked="" class="hidden" name="fav_mode" type="radio" value="hokm"/>
<span class="font-title text-title text-on-surface">Hokm</span>
</label>
<label class="flex items-center justify-center p-3 rounded-lg border-2 border-transparent bg-surface-muted cursor-pointer hover:bg-surface-hover transition-all">
<input class="hidden" name="fav_mode" type="radio" value="suna"/>
<span class="font-title text-title text-on-surface-variant">Suna</span>
</label>
</div>
</div>
</form>
<!-- Action Buttons -->
<div class="flex flex-col gap-md mt-md">
<button class="bg-primary-dark text-on-surface font-title text-title h-[52px] rounded-full shadow-[0_4px_20px_rgba(124,58,237,0.3)] hover:bg-primary-light transition-all active:scale-95 flex items-center justify-center w-full">
                Save Changes
            </button>
<button class="text-on-surface-variant font-label text-label hover:text-on-surface transition-colors w-full text-center py-2">
                Cancel
            </button>
</div>
</main>
</body></html>
