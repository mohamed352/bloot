<!DOCTYPE html>

<style>
        /* Ambient Glows for Premium Feel */
        .glow-primary {
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
        }
        .shadow-elevated {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        /* Custom input styles for OTP */
        .otp-input:focus {
            box-shadow: 0 0 0 2px theme('colors.primary'), 0 0 15px rgba(139, 92, 246, 0.3);
            border-color: theme('colors.primary');
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center font-body antialiased selection:bg-primary/30 selection:text-primary">
<!-- Top Navigation for Context (Back Button) -->
<!-- Note: Suppressed main nav shell as this is a linear/transactional screen -->
<div class="fixed top-0 w-full z-50 flex justify-between items-center px-lg py-md max-w-[448px] mx-auto bg-surface/80 backdrop-blur-xl">
<button class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-surface-hover active:scale-95 transition-all text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-display text-display text-primary tracking-wider">Bloot</span>
<div class="w-[44px]"></div> <!-- Spacer for center alignment -->
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[448px] px-xl flex flex-col pt-xxl mt-xxl h-full flex-grow">
<!-- Header Section -->
<div class="flex flex-col items-center text-center mt-xl mb-xxl space-y-sm">
<div class="w-16 h-16 rounded-2xl bg-surface-elevated border border-border flex items-center justify-center mb-md glow-primary">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline text-headline text-on-surface">Verify Your Phone</h1>
<p class="font-body text-body text-on-surface-variant max-w-[280px]">
                Enter the 4-digit code sent to <span class="font-bold text-on-surface">+966 5X XXX XXXX</span>
</p>
</div>
<!-- OTP Input Area -->
<!-- RTL Note: In RTL environments, ensure flex-row-reverse is NOT applied to these inputs if the digits are entered left-to-right, 
             or handle via localized logic. -->
<div class="flex justify-center gap-md mb-xl" dir="ltr">
<input class="otp-input w-[56px] h-[56px] text-center font-score text-score bg-surface-muted border border-border-light rounded-xl text-on-surface transition-all duration-200" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="4"/>
<input class="otp-input w-[56px] h-[56px] text-center font-score text-score bg-surface-muted border border-border-light rounded-xl text-on-surface transition-all duration-200" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="8"/>
<input autofocus="" class="otp-input w-[56px] h-[56px] text-center font-score text-score bg-surface-muted border border-primary rounded-xl text-on-surface transition-all duration-200 shadow-[0_0_15px_rgba(139,92,246,0.3)]" inputmode="numeric" maxlength="1" pattern="[0-9]*" placeholder="" type="text"/>
<input class="otp-input w-[56px] h-[56px] text-center font-score text-score bg-surface-muted border border-border-light rounded-xl text-on-surface transition-all duration-200" inputmode="numeric" maxlength="1" pattern="[0-9]*" placeholder="" type="text"/>
</div>
<!-- Resend Section -->
<div class="flex flex-col items-center justify-center space-y-xs mb-xxl">
<p class="font-caption text-caption text-on-surface-muted flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                Resend code in <span class="font-bold text-on-surface-variant w-[40px]">00:59</span>
</p>
<button class="font-label text-label text-on-surface-muted opacity-50 cursor-not-allowed mt-sm" disabled="">
                Resend Code
            </button>
</div>
<!-- Action Area (Pushed to bottom using flex-grow on container above if needed, or margin auto) -->
<div class="mt-auto pb-xl pt-md">
<button class="w-full h-[52px] rounded-full bg-gradient-to-r from-primary-dark to-primary-light text-on-primary-fixed font-title text-title flex items-center justify-center glow-primary active:scale-95 transition-transform shadow-[0_4px_20px_rgba(124,58,237,0.4)]">
                Verify
            </button>
</div>
</main>
</body></html>
