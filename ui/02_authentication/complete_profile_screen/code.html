<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>

                    "borderRadius": {

<style>
        .glass-panel {
            background: rgba(33, 30, 39, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.15);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #FBBF24 0%, #D97706 100%);
        }
        .purple-gradient {
            background: linear-gradient(135deg, #a078ff 0%, #7C3AED 100%);
        }
        .input-glow:focus-within {
            border-color: #d0bcff;
            box-shadow: 0 0 0 2px rgba(208, 188, 255, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased font-body flex flex-col min-h-screen">
<!-- Note on RTL: For full RTL support, add dir="rtl" to the html tag. 
         Tailwind's logical properties (e.g., ms-, me-, ps-, pe-) should be used 
         instead of directional ones (ml-, mr-, pl-, pr-) where applicable, though 
         this layout primarily uses centering and full-width elements. -->
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-lg py-md max-w-[448px] mx-auto bg-surface/80 backdrop-blur-xl border-b border-border-light shadow-md shadow-primary-dark/5">
<!-- Leading Avatar/Back (Empty for this flow, but preserving structure) -->
<div class="w-10"></div>
<!-- Headline -->
<div class="text-display font-display font-extrabold text-primary tracking-wider">Bloot</div>
<!-- Trailing Action -->
<div class="w-10"></div>
</header>
<main class="flex-grow flex flex-col items-center pt-[88px] px-xl pb-safe max-w-[448px] mx-auto w-full relative z-10">
<!-- Headers -->
<div class="text-center mt-xl mb-xxl w-full">
<h1 class="font-headline text-headline text-on-surface mb-sm">Set Up Your Profile</h1>
<p class="font-body text-body text-on-surface-variant">Choose a display name and profile picture</p>
</div>
<!-- Profile Photo Upload -->
<div class="relative mb-xxl group cursor-pointer">
<div class="w-[120px] h-[120px] rounded-full purple-gradient p-1 flex items-center justify-center shadow-[0_0_40px_rgba(139,92,246,0.15)] transition-transform duration-300 active:scale-95">
<div class="w-full h-full rounded-full bg-surface-elevated overflow-hidden border-2 border-surface-elevated">
<!-- Placeholder avatar using background -->
<div class="w-full h-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[64px] text-on-surface-variant opacity-50" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</div>
</div>
<!-- Camera Overlay -->
<div class="absolute bottom-0 right-0 w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center border-4 border-surface shadow-lg">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<!-- Form Fields -->
<div class="w-full space-y-lg mb-xl">
<!-- Display Name -->
<div class="space-y-xs">
<div class="flex justify-between px-1">
<label class="font-label text-label text-on-surface">Display Name</label>
<span class="font-caption text-caption text-on-surface-variant">0/20</span>
</div>
<div class="relative bg-surface-muted border border-border rounded-lg input-glow transition-all duration-200">
<input class="w-full bg-transparent border-none text-on-surface font-body text-body px-lg py-[14px] focus:ring-0 placeholder:text-on-surface-variant/50" placeholder="Your display name" type="text"/>
</div>
</div>
<!-- Username -->
<div class="space-y-xs">
<label class="font-label text-label text-on-surface px-1">Username</label>
<div class="relative bg-surface-muted border border-border rounded-lg input-glow transition-all duration-200 flex items-center">
<input class="w-full bg-transparent border-none text-on-surface font-body text-body px-lg py-[14px] focus:ring-0 placeholder:text-on-surface-variant/50 pr-12" placeholder="@choose_username" type="text"/>
<div class="absolute right-lg flex items-center justify-center">
<span class="material-symbols-outlined text-success text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</div>
<!-- Terms -->
<div class="w-full mb-xxl flex items-start space-x-md">
<div class="pt-1">
<input class="w-5 h-5 rounded bg-surface-muted border-border text-primary focus:ring-primary focus:ring-offset-surface cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-caption text-caption text-on-surface-variant leading-relaxed cursor-pointer" for="terms">
                I agree to the <a class="text-primary hover:text-primary-light underline decoration-primary/30 underline-offset-2" href="#">Terms of Service</a> and <a class="text-primary hover:text-primary-light underline decoration-primary/30 underline-offset-2" href="#">Privacy Policy</a>.
            </label>
</div>
<!-- Actions -->
<div class="w-full mt-auto mb-xl space-y-md">
<button class="w-full h-[52px] rounded-full gold-gradient text-on-secondary-fixed font-title text-title shadow-[0_0_20px_rgba(245,158,11,0.2)] hover:shadow-[0_0_30px_rgba(245,158,11,0.4)] transition-all duration-200 active:scale-[0.98] flex items-center justify-center">
                Start Playing
            </button>
<button class="w-full h-[52px] rounded-full bg-transparent border border-transparent text-on-surface-variant font-title text-title hover:text-on-surface transition-colors duration-200">
                Set up later
            </button>
</div>
</main>
<!-- Background Decoration (Ambient Glows) -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary opacity-[0.03] blur-[80px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary-dark opacity-[0.04] blur-[100px]"></div>
</div>
</body></html>
